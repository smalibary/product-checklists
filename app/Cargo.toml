[package]
name = "agentscreen"
version = "0.1.0"
edition = "2021"

[dependencies]
agentscreen-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
