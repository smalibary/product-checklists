[package]
name = "agentscreen-core"
version = "0.1.0"
edition = "2021"

[dependencies]
chromiumoxide = "0.9"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
