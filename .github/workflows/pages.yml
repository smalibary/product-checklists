# Builds the live examples (web/), adds the checklists page (note/site/) and publishes them to GitHub Pages on every push to main.
name: Publish live examples
on:
  push:
    branches: [main]
    paths: ["web/**", "note/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE_PATH: /product-checklists
      - run: touch out/.nojekyll
      # The full checklists page (one HTML file + its data) lives at /checklists/.
      - run: |
          cp -r ../note/site out/checklists
          # The page is written for the claude.ai artifact, which adds the document head; add it here too.
          { printf '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">\n'; cat ../note/site/index.html; } > out/checklists/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
